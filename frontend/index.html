    <script>
      // Applique le thème système avant le premier rendu pour éviter tout flash,
      // et suit les changements de préférence à chaud.
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (matches) {
          document.documentElement.classList.toggle("dark", matches);
        };
        apply(query.matches);
        query.addEventListener("change", function (e) {
          apply(e.matches);
        });
      })();
    </script>
