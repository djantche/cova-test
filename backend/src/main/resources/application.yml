server:
  port: 8080

spring:
  application:
    name: taskmanager
  datasource:
    # URL JDBC complète surchargeable via DB_URL (utile sur les PaaS type Render).
    # Sinon elle est construite depuis DB_HOST/DB_PORT/DB_NAME.
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskmanager}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true}
    username: ${DB_USER:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Les plans gratuits (ex: Clever Cloud DEV) limitent souvent le nombre de
      # connexions simultanées autorisées (max_user_connections=5) ; on reste
      # largement en dessous pour laisser de la marge à d'autres clients.
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:c92f1c9c8e6a4b2d9e6d1a7f3b5c8e2a4d6f9b1c3e5a7d9f1b3c5e7a9d1f3b5c}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
